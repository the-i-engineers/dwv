# Node.js CI workflow

name: Node.js CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v1
      with:
        node-version: '14.x'
    - name: Install dependencies
      run: yarn install --frozen-lockfile
    - name: Run lint
      run: yarn run lint
    - name: Run tests
      run: yarn run test-ci
    - name: Build
      run: yarn run build

  status-check:
    needs: [build]
    if: always()
    uses: the-i-engineers/reusable-workflows/.github/workflows/status-check.yml@5.5.0
    with:
      result: >-
        ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
            && 'failure' || 'success' }}
